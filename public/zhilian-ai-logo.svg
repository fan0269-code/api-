<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#0EA5E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(35, 60)">
    <g stroke="url(#lineGradient)" stroke-width="1.5" fill="none" opacity="0.7">
      <line x1="-25" y1="-25" x2="0" y2="0"/>
      <line x1="25" y1="-25" x2="0" y2="0"/>
      <line x1="-25" y1="25" x2="0" y2="0"/>
      <line x1="25" y1="25" x2="0" y2="0"/>
      <line x1="-25" y1="-25" x2="25" y2="-25"/>
      <line x1="-25" y1="25" x2="25" y2="25"/>
      <line x1="-25" y1="-25" x2="-25" y2="25"/>
      <line x1="25" y1="-25" x2="25" y2="25"/>
    </g>

    <g fill="url(#nodeGradient)" filter="url(#softShadow)">
      <circle cx="-25" cy="-25" r="6"/>
      <circle cx="25" cy="-25" r="6"/>
      <circle cx="-25" cy="25" r="6"/>
      <circle cx="25" cy="25" r="6"/>
    </g>

    <g>
      <circle cx="0" cy="0" r="12" fill="url(#nodeGradient)" filter="url(#softShadow)"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="3" fill="url(#nodeGradient)"/>
    </g>
  </g>

  <g transform="translate(105, 60)">
    <text x="0" y="-5" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" fill="url(#textGradient)">
      智链 AI
    </text>
    <text x="0" y="25" font-family="'Inter', 'Helvetica', sans-serif" font-size="14" font-weight="400" fill="#64748B" letter-spacing="2">
      Zhilian AI
    </text>
  </g>
</svg>
